# Headless homelab servers (Ubuntu Server + systemd), e.g. homelab-00.
# CLI-only: no desktop, docker, claude, aws, or obsidian. Brew bootstrap is
# KaiNakamura/homelab bootstrap.sh's job. th is last because it builds a
# private repo and needs `gh auth login -p ssh` first.
extends =
modules =
  git-config
  zsh
  starship
  zoxide
  bat
  btop
  delta
  eza
  fd
  fzf
  tldr
  nvim
  vim
  tailscale
  zmx
  th
shell = zsh
git_mode = replace
wire_shell_rc = false
