# Headless Coder workspaces (bash). Brew bootstrap is the workspace shim's job.
extends =
modules =
  git-config
  bash
  starship
  claude
  vim
  zoxide
  bat
  btop
  delta
  eza
  fd
  fzf
  tldr
  aws
  worktrunk
  nvim
  docker
  obsidian
  zmx
  th
  hermes-spoke
shell = bash
git_mode = include
wire_shell_rc = false
start_hermes = true
